services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gp_access_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d gp_access_planner"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - planner-postgres:/var/lib/postgresql/data

volumes:
  planner-postgres:
