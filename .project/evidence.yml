version: 1
evidence:
  - id: representative-data-v1
    status: verified
    kind: source-manifest
    path: data/representative/v1/manifest.yml
    claim: Fully synthetic daily appointment aggregates contain no PHI or clinical fields.
  - id: baseline-inputs-v1
    status: verified
    kind: evaluation-input
    path: docs/metric-contract.md
    claim: The fixed training and holdout windows define reproducible baseline inputs.
  - id: local-workflow-v1
    status: verified
    kind: runnable-local-workflow
    path: src/capacity_forecasting/workflow.py
    claim: The local command validates the approved fixture, writes raw and curated DuckDB tables, and produces 14 seasonal-naive capacity signals.
  - id: baseline-evaluation-v1
    status: verified
    kind: evaluation-report
    path: evaluation/report.md
    claim: The fixed synthetic holdout has documented quality, calibration, latency, cost, freshness, and limitation evidence.
  - id: nhs-gpad-apr-2026-national-daily-v1
    status: verified
    kind: source-manifest
    path: data/nhs-gpad/apr-2026-national-daily-v1/manifest.yml
    claim: A checksum-verified, England-wide 61-day GPAD derivative retains only public aggregate Attended, DNA, and Unknown status counts with no PHI.
  - id: gpad-local-workflow-v1
    status: verified
    kind: runnable-local-workflow
    path: src/capacity_forecasting/workflow.py
    claim: The active local workflow validates GPAD daily aggregates, writes DuckDB raw and curated tables, and compares its 14-day weekday baseline with a positive hypothetical capacity scenario.
  - id: gpad-dashboard-preview-v1
    status: verified
    kind: browser-verified-dashboard
    path: dashboard/index.html
    claim: The local dashboard loaded without an error overlay and updated the capacity scenario result in browser verification on 2026-07-31.
  - id: cloudflare-workers-deployment-v1
    status: verified
    kind: public-deployment
    path: docs/deployment-evidence.md
    claim: Cloudflare Worker version cbb4d4d9-2ca6-444d-9301-639c6a3fc5cf publicly serves the GPAD dashboard and records deployed source SHA 6e8f390.
  - id: deployment-decision-v1
    status: verified
    kind: deployment-decision
    path: docs/deployment-decision.md
    claim: The first demo is intentionally local-only with no provider, public exposure, or metered service cost.
