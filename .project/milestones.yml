version: 1
project: healthcare-appointment-capacity-forecasting
status: complete
milestones:
  - id: M1
    title: Define data and baseline
    status: complete
    acceptance:
      - Document the representative data boundary.
      - Add a reproducible baseline and versioned evaluation inputs.
  - id: M2
    title: Build one end-to-end local workflow
    status: complete
    acceptance:
      - A reviewer can complete the first-demo workflow locally.
      - UI/API states are clear and safe.
  - id: M3
    title: Prove quality and first-demo readiness
    status: complete
    acceptance:
      - Tests, evaluation, documentation, architecture, cost, and limitations are current.
  - id: R1
    title: Rebaseline on public NHS GPAD aggregate data
    status: complete
    acceptance:
      - Download provenance, checksum, license, and no-PHI evidence are recorded for an NHS GPAD release.
      - A compact England-wide aggregate fixture preserves Attended, DNA, and Unknown status counts without retaining lower-granularity rows.
      - The data contract explicitly excludes observed capacity and forbids relabelling Unknown as cancellation.
  - id: R2
    title: Rebuild local forecasting workflow and evaluation
    status: complete
    acceptance:
      - DuckDB lineage, tests, and evaluation use the verified GPAD fixture.
      - Capacity is a labelled user-supplied scenario input rather than an observed source field.
      - Public claims distinguish historical national aggregates from hypothetical capacity scenarios.
  - id: R3
    title: Build and preview the decision dashboard
    status: complete
    acceptance:
      - A local, responsive dashboard exposes the real-data workflow, scenario control, evidence, and safe refusal states.
      - A human approves the hosted visual direction before a public build is prepared.
  - id: M4
    title: Decide deployment
    status: complete
    acceptance:
      - Human approves provider, cost, exposure, and teardown when deployment is useful.
  - id: M5
    title: Verify and publish
    status: complete
    acceptance:
      - Deployed revision proves its exact source SHA.
      - Public facts link to verified evidence.
