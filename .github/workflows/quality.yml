name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gp_access_planner
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U planner -d gp_access_planner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://planner:planner@127.0.0.1:5432/gp_access_planner
      NEXT_PUBLIC_FIXTURE_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: uv run gp-access-planner migrate
      - run: uv run python scripts/load_generated_fixture.py
      - run: uv run dbt build --profiles-dir .
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npm run build
      - run: npm run worker:check
      - run: git diff --check
