name: promote approved release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Candidate release identifier that passed private and live smoke tests
        required: true
      production_url:
        description: Production Worker URL
        required: true
        default: https://gp-access-planner.gp-access-planner.workers.dev

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_ID: ${{ inputs.release_id }}
      PRODUCTION_URL: ${{ inputs.production_url }}
      NEXT_PUBLIC_FIXTURE_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify smoked candidate remains selected
        run: |
          npx wrangler r2 object get gp-access-planner-releases/candidate.json --file=/tmp/candidate.json --remote
          jq -e --arg release "$RELEASE_ID" '.release_id == $release' /tmp/candidate.json
      - run: python3 scripts/promote_release.py "$RELEASE_ID" gp-access-planner-releases
      - run: npx wrangler deploy --env="" --config worker/wrangler.jsonc
      - name: Smoke production
        run: |
          curl --fail --retry 6 --retry-all-errors "$PRODUCTION_URL/api/v1/meta" --output /tmp/meta.json
          jq -e --arg release "$RELEASE_ID" '.release_id == $release and .classification == "derived"' /tmp/meta.json

# Protect the production environment with required reviewers. The pointer changes only
# after candidate smoke passes; the Worker deploy completes first replacement cutover.
