[project]
name = "gp-access-planner"
version = "1.0.0"
description = "Public-data GP access-pressure forecasting and synthetic capacity planning"
requires-python = ">=3.12"
dependencies = [
  "catboost>=1.2.8,<2",
  "dbt-postgres>=1.9,<2",
  "lightgbm>=4.6,<5",
  "numpy>=2.2,<3",
  "odfpy>=1.4.1,<2",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<24",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
gp-access-planner = "gp_access_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gp_access_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gp_access_planner"]
disable_error_code = ["import-untyped", "no-any-return"]
